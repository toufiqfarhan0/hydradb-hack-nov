version: '3.8'

services:
  # 1. MinIO S3-Compatible Object Store
  # Resolves the HydraDB 'PutMode::Update not yet implemented by LocalFileSystem' bug
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: lucen-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Bucket Initializer
  create-buckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing localminio/hydra-graph-store;
      /usr/bin/mc anonymous set public localminio/hydra-graph-store;
      exit 0;
      "

  # 2. HydraDB Engine (Connected to S3 Object Store via SlateDB)
  hydradb:
    image: ghcr.io/hydra-db/hydradb:latest
    container_name: lucen-hydradb
    restart: always
    ports:
      - "8080:8080" # HTTP REST / OpenCypher
      - "7687:7687" # Neo4j Bolt 5.x Protocol
    environment:
      - CLOUD_PROVIDER=s3
      - S3_BUCKET=hydra-graph-store
      - AWS_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      - AWS_ALLOW_HTTP=true
      - PORT=8080
    depends_on:
      create-buckets:
        condition: service_completed_successfully

  # 3. Lucen Context Layer Application (FastAPI + Swiss Design UI)
  lucen-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: lucen-app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - HYDRADB_ENDPOINT=http://hydradb:8080
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=hydra-graph-store
    depends_on:
      - minio

volumes:
  minio_data:
